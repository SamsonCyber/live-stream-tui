[project]
name = "live-stream-tui"
version = "0.3.0"
description = "Live markdown stream + Hermes-style dual-line render-rate graph TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=1.0.0",
  "rich>=13.0.0",
]

[project.scripts]
live-stream = "live_stream_tui.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
